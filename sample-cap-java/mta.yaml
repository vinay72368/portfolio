_schema-version: '3.1'
ID: shop
version: 1.0.0
description: Sample CAP Java shop on SAP BTP

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # The CAP Java application (Spring Boot jar, UI5 app included) on Cloud Foundry
  - name: shop-srv
    type: java
    path: srv
    properties:
      SPRING_PROFILES_ACTIVE: cloud
      JBP_CONFIG_COMPONENTS: "jres: ['com.sap.xs.java.buildpack.jre.SAPMachineJRE']"
      JBP_CONFIG_SAP_MACHINE_JRE: '{ version: 17.+ }'
    build-parameters:
      builder: custom
      commands:
        - mvn clean package -DskipTests=true -Pcloud
      build-result: target/*.[wj]ar
    requires:
      - name: shop-db
      - name: shop-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # Deploys tables and views to SAP HANA Cloud (HDI container)
  - name: shop-db-deployer
    type: hdb
    path: db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: shop-db

resources:
  - name: shop-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: shop-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
