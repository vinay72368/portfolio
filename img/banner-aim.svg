<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" role="img" aria-label="Pipeline and corrosion gauge">
  <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2a4a"/><stop offset="1" stop-color="#0c6aa8"/></linearGradient></defs>
  <rect width="400" height="160" fill="url(#b)"/>
  <!-- pipeline -->
  <g stroke="#9fd3ff" stroke-width="10" stroke-linecap="round" fill="none" opacity=".35"><path d="M0 120 H140 V80 H260"/></g>
  <g stroke="#e6f4ff" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="6 14"><path d="M0 120 H140 V80 H260"><animate attributeName="stroke-dashoffset" values="40;0" dur="1.6s" repeatCount="indefinite"/></path></g>
  <rect x="120" y="102" width="40" height="36" rx="6" fill="#0a1f3a" stroke="#9fd3ff" stroke-width="2"/><rect x="238" y="62" width="40" height="36" rx="6" fill="#0a1f3a" stroke="#9fd3ff" stroke-width="2"/>
  <!-- gauge -->
  <g transform="translate(320 98)">
    <path d="M-52 0 A52 52 0 0 1 52 0" stroke="#ffffff33" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M-52 0 A52 52 0 0 1 -16 -49" stroke="#3fd98c" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M-16 -49 A52 52 0 0 1 28 -44" stroke="#ffc83d" stroke-width="12" fill="none"/>
    <path d="M28 -44 A52 52 0 0 1 52 0" stroke="#ff5a5f" stroke-width="12" fill="none" stroke-linecap="round"/>
    <g><animateTransform attributeName="transform" type="rotate" values="-60;40;-60" dur="6s" repeatCount="indefinite"/><path d="M0 0 L0 -44" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g>
    <circle r="7" fill="#fff"/>
    <text y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="12" fill="#fff">mm / year</text>
  </g>
</svg>
