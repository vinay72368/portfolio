<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" role="img" aria-label="Java Spring Boot applications developed on SAP with CAP and CDS, and on GCP">
  <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1b3a"/><stop offset="1" stop-color="#0e5f6f"/></linearGradient></defs>
  <rect width="400" height="160" fill="url(#b)"/>
  <!-- SAP, with CDS -->
  <rect x="14" y="34" width="90" height="92" rx="16" fill="#0a6ed1"/>
  <text x="59" y="80" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="800" font-size="25" fill="#fff">SAP</text>
  <rect x="29" y="92" width="60" height="18" rx="9" fill="#ffffff" fill-opacity=".22"/>
  <text x="59" y="105" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="700" font-size="10" fill="#fff">CAP &#183; CDS</text>
  <!-- GCP -->
  <rect x="296" y="34" width="90" height="92" rx="16" fill="#0f2c52" stroke="#4285f4" stroke-width="2.5"/>
  <text x="341" y="80" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="800" font-size="25" fill="#cfe0ff">GCP</text>
  <rect x="319" y="92" width="44" height="18" rx="9" fill="#4285f4" fill-opacity=".28"/>
  <text x="341" y="105" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="700" font-size="10" fill="#cfe0ff">Cloud</text>
  <!-- the links to the shared Java Spring Boot layer -->
  <line x1="106" y1="80" x2="126" y2="80" stroke="#e6fff7" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
  <circle r="3.4" cy="80" fill="#fff"><animate attributeName="cx" values="106;126;106" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
  <line x1="274" y1="80" x2="294" y2="80" stroke="#e6fff7" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
  <circle r="3.4" cy="80" fill="#fff"><animate attributeName="cx" values="274;294;274" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
  <!-- Java Spring Boot -->
  <rect x="126" y="40" width="148" height="80" rx="16" fill="#143d33" stroke="#2fa84f" stroke-width="2"/>
  <g><rect x="154" y="62" width="26" height="26" rx="8" fill="#2fa84f"><animate attributeName="opacity" values=".6;1;.6" dur="3.2s" begin="0s" repeatCount="indefinite"/></rect><circle cx="167" cy="75" r="7.5" fill="#fff" opacity=".95"/><path d="M163 78 q4 -9 9 -9 q-1 8 -9 9z" fill="#2fa84f"/></g><g><rect x="187" y="62" width="26" height="26" rx="8" fill="#2fa84f"><animate attributeName="opacity" values=".6;1;.6" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></rect><circle cx="200" cy="75" r="7.5" fill="#fff" opacity=".95"/><path d="M196 78 q4 -9 9 -9 q-1 8 -9 9z" fill="#2fa84f"/></g><g><rect x="220" y="62" width="26" height="26" rx="8" fill="#2fa84f"><animate attributeName="opacity" values=".6;1;.6" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></rect><circle cx="233" cy="75" r="7.5" fill="#fff" opacity=".95"/><path d="M229 78 q4 -9 9 -9 q-1 8 -9 9z" fill="#2fa84f"/></g>
  <text x="200" y="108" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="800" font-size="11.5" fill="#fff">Java Spring Boot</text>
